services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "${TEST_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      B2B_DB_NAME: ${B2B_DB_NAME}
      B2C_DB_NAME: ${B2C_DB_NAME}
      MODERATION_DB_NAME: ${MODERATION_DB_NAME}
    volumes:
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared_ms_network

  rabbitmq:
    image: rabbitmq:4.3.1-management
    restart: always
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shared_ms_network

  minio:
    image: minio/minio
    restart: always
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_PANEL_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared_ms_network

  b2b-migrate:
    build: ./services/b2b
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "-c", "/app/database/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${B2B_DATABASE_URL}
      DATABASE_VERBOSE: ${B2B_DATABASE_VERBOSE}
      SESSION_EXPIRE_SECONDS: ${B2B_SESSION_EXPIRE_SECONDS}
      SECRET_KEY: ${B2B_SECRET_KEY}
      ALGORITHM: ${B2B_ALGORITHM}
      S3_ENDPOINT: ${B2B_S3_ENDPOINT}
      S3_ACCESS_KEY: ${B2B_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${B2B_S3_SECRET_KEY}
      S3_BUCKET: ${B2B_S3_BUCKET}
      MAX_SIZE: ${B2B_MAX_SIZE}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      INBOX_MESSAGES_PROCESSING_DELAY: ${B2B_INBOX_MESSAGES_PROCESSING_DELAY}
      OUTBOX_MESSAGES_PROCESSING_DELAY: ${B2B_OUTBOX_MESSAGES_PROCESSING_DELAY}
      B2C_SERVICE_KEY: ${B2B_B2C_SERVICE_KEY}
      MODERATION_SERVICE_KEY: ${B2B_MODERATION_SERVICE_KEY}
    networks:
      - shared_ms_network

  b2c-migrate:
    build: ./services/b2c
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "-c", "/app/database/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${B2C_DATABASE_URL}
      DEBUG: ${B2C_DEBUG}
      DATABASE_VERBOSE: ${B2C_DATABASE_VERBOSE}
      SESSION_EXPIRE_SECONDS: ${B2C_SESSION_EXPIRE_SECONDS}
      SECRET_KEY: ${B2C_SECRET_KEY}
      ALGORITHM: ${B2C_ALGORITHM}
      X_SERVICE_KEY: ${B2C_X_SERVICE_KEY}
      B2B_BASE_URL: ${B2C_B2B_BASE_URL}
      B2B_SERVICE_KEY: ${B2C_B2B_SERVICE_KEY}
      B2B_REQUEST_TIMEOUT: ${B2C_B2B_REQUEST_TIMEOUT}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      INBOX_MESSAGES_PROCESSING_DELAY: ${B2C_INBOX_MESSAGES_PROCESSING_DELAY}
      OUTBOX_MESSAGES_PROCESSING_DELAY: ${B2C_OUTBOX_MESSAGES_PROCESSING_DELAY}
    networks:
      - shared_ms_network

  moderation-migrate:
    build: ./services/moderation
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "-c", "/app/database/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${MODERATION_DATABASE_URL}
      SESSION_EXPIRE_SECONDS: ${MODERATION_SESSION_EXPIRE_SECONDS}
      SECRET_KEY: ${MODERATION_SECRET_KEY}
      ALGORITHM: ${MODERATION_ALGORITHM}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_EXCHANGE: ${MODERATION_RABBITMQ_EXCHANGE}
      B2B_SERVICE_KEY: ${MODERATION_B2B_SERVICE_KEY}
      OUTBOX_POLL_INTERVAL_SECONDS: ${MODERATION_OUTBOX_POLL_INTERVAL_SECONDS}
      IN_REVIEW_CLAIM_TIMEOUT_MINUTES: ${MODERATION_IN_REVIEW_CLAIM_TIMEOUT_MINUTES}
    networks:
      - shared_ms_network

  b2b-backend:
    build: ./services/b2b
    restart: always
    ports:
      - "${B2B_PUBLIC_PORT}:${B2B_APP_PORT}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      b2b-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${B2B_DATABASE_URL}
      DATABASE_VERBOSE: ${B2B_DATABASE_VERBOSE}
      SESSION_EXPIRE_SECONDS: ${B2B_SESSION_EXPIRE_SECONDS}
      SECRET_KEY: ${B2B_SECRET_KEY}
      ALGORITHM: ${B2B_ALGORITHM}
      S3_ENDPOINT: ${B2B_S3_ENDPOINT}
      S3_ACCESS_KEY: ${B2B_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${B2B_S3_SECRET_KEY}
      S3_BUCKET: ${B2B_S3_BUCKET}
      MAX_SIZE: ${B2B_MAX_SIZE}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      INBOX_MESSAGES_PROCESSING_DELAY: ${B2B_INBOX_MESSAGES_PROCESSING_DELAY}
      OUTBOX_MESSAGES_PROCESSING_DELAY: ${B2B_OUTBOX_MESSAGES_PROCESSING_DELAY}
      B2C_SERVICE_KEY: ${B2B_B2C_SERVICE_KEY}
      MODERATION_SERVICE_KEY: ${B2B_MODERATION_SERVICE_KEY}
    networks:
      - shared_ms_network

  b2c-backend:
    build: ./services/b2c
    restart: always
    ports:
      - "${B2C_PUBLIC_PORT}:${B2C_APP_PORT}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      b2c-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${B2C_DATABASE_URL}
      DEBUG: ${B2C_DEBUG}
      DATABASE_VERBOSE: ${B2C_DATABASE_VERBOSE}
      SESSION_EXPIRE_SECONDS: ${B2C_SESSION_EXPIRE_SECONDS}
      SECRET_KEY: ${B2C_SECRET_KEY}
      ALGORITHM: ${B2C_ALGORITHM}
      X_SERVICE_KEY: ${B2C_X_SERVICE_KEY}
      B2B_BASE_URL: ${B2C_B2B_BASE_URL}
      B2B_SERVICE_KEY: ${B2C_B2B_SERVICE_KEY}
      B2B_REQUEST_TIMEOUT: ${B2C_B2B_REQUEST_TIMEOUT}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      INBOX_MESSAGES_PROCESSING_DELAY: ${B2C_INBOX_MESSAGES_PROCESSING_DELAY}
      OUTBOX_MESSAGES_PROCESSING_DELAY: ${B2C_OUTBOX_MESSAGES_PROCESSING_DELAY}
    networks:
      - shared_ms_network

  moderation-backend:
    build: ./services/moderation
    restart: always
    ports:
      - "${MODERATION_PUBLIC_PORT}:${MODERATION_APP_PORT}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      moderation-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${MODERATION_DATABASE_URL}
      SESSION_EXPIRE_SECONDS: ${MODERATION_SESSION_EXPIRE_SECONDS}
      SECRET_KEY: ${MODERATION_SECRET_KEY}
      ALGORITHM: ${MODERATION_ALGORITHM}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_EXCHANGE: ${MODERATION_RABBITMQ_EXCHANGE}
      B2B_SERVICE_KEY: ${MODERATION_B2B_SERVICE_KEY}
      OUTBOX_POLL_INTERVAL_SECONDS: ${MODERATION_OUTBOX_POLL_INTERVAL_SECONDS}
      IN_REVIEW_CLAIM_TIMEOUT_MINUTES: ${MODERATION_IN_REVIEW_CLAIM_TIMEOUT_MINUTES}
    networks:
      - shared_ms_network

networks:
  shared_ms_network:
    name: frontend_mdt_test_network
    driver: bridge

volumes:
  pgdata:
  minio-data:
